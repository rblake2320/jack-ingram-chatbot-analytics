[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.bandit]
exclude_dirs = ["tests", "test"]
skips = ["B101"]  # Skip assert_used test

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "jack-ingram-chatbot-analytics"
description = "Analytics-enabled chatbot solution for Jack Ingram Motors"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "rblake2320", email = "rblake2320@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]
dependencies = [
    "flask>=3.1.1",
    "requests>=2.32.4",
    "python-dotenv>=1.1.0",
    "gunicorn>=21.2.0",
    "aiohttp>=3.10.12",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "httpx>=0.28.1",
    "aiodns>=3.1.1",
    "cchardet>=2.1.7",
    "uvloop>=0.19.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/rblake2320/jack-ingram-chatbot-analytics"
Repository = "https://github.com/rblake2320/jack-ingram-chatbot-analytics"
Issues = "https://github.com/rblake2320/jack-ingram-chatbot-analytics/issues"