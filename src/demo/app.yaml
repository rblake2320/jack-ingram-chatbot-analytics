# Template only. Configure SESSION_SECRET and ADMIN_TOKEN as provider-managed secrets.
# SQLite needs a durable volume for retained state; do not autoscale this local demo.
name: jack-ingram-chatbot
region: nyc
services:
  - name: web
    github:
      repo: rblake2320/jack-ingram-chatbot-analytics
      branch: main
      deploy_on_push: false
    source_dir: /
    envs:
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: CHAT_PROVIDER
        value: local
      - key: TRUSTED_HOSTS
        value: localhost,127.0.0.1
      - key: SESSION_SECRET
        type: SECRET
    build_command: pip install --require-hashes -r requirements.lock
    run_command: python -m src.demo.app
    http_port: 8080
    instance_size_slug: basic-xxs
    instance_count: 1
    health_check:
      http_path: /health
    routes:
      - path: /
