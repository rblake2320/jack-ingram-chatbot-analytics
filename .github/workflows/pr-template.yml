name: Pull Request Template
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - name: Require a reviewable description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python -c "import os; body=os.environ.get('PR_BODY',''); assert '## Description' in body and 'No description provided' not in body, 'Include a concrete Description and validation'"
