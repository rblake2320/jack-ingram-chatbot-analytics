name: Chatbot acceptance
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: git diff --exit-code -- src/demo/static/atlas src/demo/static/models/porsche-9922-systems.glb src/demo/data/porsche_9922_systems.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_repository.py
      - run: python -m ruff check src scripts
      - run: python -m pytest -q --junitxml=acceptance.xml
      - run: python scripts/verify_http.py --output http-acceptance.json
      - run: python -m pip_audit -r requirements.lock --require-hashes --progress-spinner off
      - run: python -m pip_audit -r requirements.lock --require-hashes -f cyclonedx-json -o sbom.json --progress-spinner off
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            acceptance.xml
            http-acceptance.json
            sbom.json
