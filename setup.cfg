[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    venv,
    .venv,
    docs/_build,
    build,
    dist,
    .pytest_cache
per-file-ignores =
    __init__.py:F401

[tool:pytest]
testpaths = src/demo/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
ignore_missing_imports = True
exclude = ^(build|dist|venv|\.venv)/